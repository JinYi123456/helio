[project]
name = "helio-tabpfn"
version = "0.1.0"
description = "Helio's Grass Window service — TabPFN-powered personal outdoor forecasting, running on CPU."
requires-python = ">=3.10,<3.15"
dependencies = [
  "tabpfn>=2.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
