name: bake-windows

# Re-bakes the grass windows for the three demo cities. With a TABPFN_TOKEN
# secret the real TabPFN model scores them; without one it bakes honest
# open-meteo + heuristic windows so the site still works. The commit below
# triggers Render's auto-deploy, so the hosted tabpfn service always serves
# fresh windows.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v5
      - name: bake windows
        working-directory: services/tabpfn
        env:
          TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
          TABPFN_NO_BROWSER: "1"
        run: uv run python -m app.precompute --days 7
      - name: commit if changed
        run: |
          git config user.name "helio-baker"
          git config user.email "baker@users.noreply.github.com"
          git add data/precomputed
          git diff --cached --quiet && echo "no change — fresh already" && exit 0
          git commit -m "chore: bake grass windows ($(date -u +%F))"
          git push
